[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvfit"
description = "Encaje entre un CV y un aviso, con la revisión del CV y el CV adaptado en PDF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luca Nicolas Baello" }]
keywords = ["cv", "resume", "ats", "job-search"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cvfit = "cvfit.analizar:main"
cvfit-servidor = "cvfit.servidor:main"

[project.urls]
Homepage = "https://github.com/lucabaello1998/cvfit"

[tool.setuptools]
packages = ["cvfit"]

[tool.setuptools.dynamic]
version = { attr = "cvfit.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
